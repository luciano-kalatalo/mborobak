[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mborobak"
version = "0.3.1"
description = "Lazy, PySpark-style DataFrames that compile to InterSystems IRIS SQL"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["intersystems-irispython>=5.4"]

[project.scripts]
mborobak-scan = "mborobak.scan:main"

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = ["pytest>=8", "pandas>=2.0"]
compat = ["pyspark==4.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mborobak"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "iris: needs a running IRIS instance (IRIS_HOST and friends)",
    "compat: differential tests against PySpark 4.3 (needs IRIS, PySpark and Java)",
]
