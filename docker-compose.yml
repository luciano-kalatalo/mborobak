# IRIS for the demo and the test suites.
#
# The InterSystems contest requires IRIS 2026.3.0AI build 154, the AI Hub Community image from the
# Early Access Program portal (download it with your own login). Load it once and point IRIS_IMAGE at
# the name that `docker load` prints:
#
#   docker load -i iris_arm64-community-2026.3.0AI.154.0-docker.tar.gz     # x64: iris-community-...
#   export IRIS_IMAGE=<the image name printed above>
#   docker compose up -d
#
# Any other IRIS image (2026.2 or later) works the same way. See the README for the first-login step.
services:
  iris:
    image: ${IRIS_IMAGE:?set IRIS_IMAGE to the IRIS image to run (see the README)}
    container_name: mborobak-iris
    command: --check-caps false
    ports:
      - "${IRIS_PORT:-1972}:1972"      # SQL / DB-API
      - "${IRIS_WEB_PORT:-52773}:52773" # Management Portal
    healthcheck:
      test: ["CMD", "iris", "qlist"]
      interval: 10s
      timeout: 5s
      retries: 12
