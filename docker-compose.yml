# IRIS for the demo and the test suites.
#
# Mborobak is developed and tested on IRIS 2026.2 (build 221U) and needs 2026.2 or later. Point
# IRIS_IMAGE at an IRIS Community image you have pulled or loaded:
#
#   export IRIS_IMAGE=<an IRIS 2026.2+ community image>
#   docker compose up -d
#
# See the README for the first-login step.
services:
  iris:
    image: ${IRIS_IMAGE:?set IRIS_IMAGE to the IRIS image to run (see the README)}
    container_name: mborobak-iris
    command: --check-caps false
    ports:
      - "${IRIS_PORT:-1972}:1972"      # SQL / DB-API
      - "${IRIS_WEB_PORT:-52773}:52773" # Management Portal
    healthcheck:
      test: ["CMD", "iris", "qlist"]
      interval: 10s
      timeout: 5s
      retries: 12
